name: CI Pipeline

on:
  push:
    branches: [main, wrynose]
  pull_request:
    branches: [main, wrynose]

env:
  KAS_CONTAINER_ENGINE: podman
  KAS_CONTAINER_IMAGE_DISTRO: debian-bookworm
  KAS_WORK_DIR: ${{ github.workspace }}/_kas
  KAS_BUILD_DIR: ${{ github.workspace }}/build

jobs:
  build:
    name: Build
    runs-on: [self-hosted, si-xlarge]
    strategy:
      matrix:
        include:
          - config: examples/qemu-x86_64-grub.yaml
            artifact: qemu-x86_64-grub
            test_platform: qemux86-64
          - config: examples/qemu-arm64-uboot.yaml
            artifact: qemu-arm64-uboot
            test_platform: qemuarm64
          - config: examples/raspberrypi-tryboot.yaml
            artifact: raspberrypi-tryboot
          - config: examples/raspberrypi-uboot.yaml
            artifact: raspberrypi-uboot
    env:
      KAS_FILES: ${{ matrix.config }}:.github/kas/ci.yaml
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Prepare mise platform detection
        run: |
          ldd_path=$(nix develop --command bash -c 'command -v ldd')
          dirname "$ldd_path" >> "$GITHUB_PATH"

      - uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
        with:
          install: false
      - name: Install Project Tools
        env:
          MISE_GITHUB_TOKEN: ${{ github.token }}
        run: mise install

      - name: Create KAS directories
        run: mkdir -p "$KAS_WORK_DIR" "$KAS_BUILD_DIR"

      - name: Validate KAS config and checkout layers
        run: mise run kas -- checkout "$KAS_FILES"

      - name: Parse recipes
        run: mise run kas -- --runtime-args "-e SI_RUNNERS_PREMIRRORS" shell "$KAS_FILES" -c "bitbake -p"

      - name: Test optional features
        if: matrix.test_platform == 'qemux86-64'
        run: mise run kas -- shell "$KAS_FILES" -c "python3 /repo/tests/test_features.py"

      - name: Build
        run: mise run kas -- --runtime-args "-e SI_RUNNERS_PREMIRRORS" build "$KAS_FILES"

      - name: Upload build artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.artifact }}
          path: |
            build/tmp/deploy/images/**/*.rootfs.wic
            build/tmp/deploy/images/**/*.rootfs.rugixb
            build/tmp/deploy/images/**/*.rootfs.rugixb.hash

      - name: Prepare app test bundles
        if: matrix.test_platform
        run: mise run kas -- shell "$KAS_FILES" -c "python3 /repo/tests/prepare_app_bundles.py"

      - name: Test
        if: matrix.test_platform
        run: mise run test -k "${{ matrix.test_platform }} or docker_component_metadata"

      - name: Upload test outputs
        if: matrix.test_platform && !cancelled()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-outputs-${{ matrix.test_platform }}
          path: test-outputs/
