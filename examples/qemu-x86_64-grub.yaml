# yaml-language-server: $schema=https://raw.githubusercontent.com/siemens/kas/refs/heads/master/kas/schema-kas.json
header:
  version: 14
  includes:
    - examples/include/common.yaml
    - examples/include/base.yaml
    - examples/include/apps-docker-compose.yaml

local_conf_header:
  image-conf: |
    IMAGE_FSTYPES = "tar.bz2 wic wic.bmap rugixb rugixb.hash"
    # Override the A/B system partition size (default: 4GiB).
    # RUGIX_SYSTEM_SIZE = "4GiB"
    # Build OVMF firmware for QEMU pflash.
    EXTRA_IMAGEDEPENDS += "ovmf"

machine: qemux86-64
distro: poky
target:
  - core-image-minimal

repos:
  meta-rugix:
    layers:
      meta-rugix-core:
      meta-rugix-qemu-x86_64-grub:
