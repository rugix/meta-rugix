[tools]
python = "3.12"
"uv" = "latest"

[env]
_.file = ".env"

KAS_CONTAINER_ENGINE = "{{ get_env(name='KAS_CONTAINER_ENGINE', default='podman') }}"
KAS_CONTAINER_IMAGE_DISTRO = "{{ get_env(name='KAS_CONTAINER_IMAGE_DISTRO', default='debian-bookworm') }}"
KAS_WORK_DIR = "{{ get_env(name='KAS_WORK_DIR', default=config_root ~ '/_kas') }}"
KAS_BUILD_DIR = "{{ get_env(name='KAS_BUILD_DIR', default=config_root ~ '/build') }}"
KAS_TMP_DIR = "{{ get_env(name='KAS_TMP_DIR', default=config_root ~ '/_tmp') }}"
SSTATE_DIR = "{{ get_env(name='SSTATE_DIR', default=config_root ~ '/cache/sstate-cache') }}"
DL_DIR = "{{ get_env(name='DL_DIR', default=config_root ~ '/cache/downloads') }}"

[vars]
deploy_dir = "{{ get_env(name='KAS_BUILD_DIR', default=config_root ~ '/build') }}/tmp/deploy/images"
ssh_opts = "-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"

[tasks.clean]
description = "Remove all build artifacts."
run = 'rm -rf "$KAS_WORK_DIR" "$KAS_BUILD_DIR" "$KAS_TMP_DIR"'

[tasks."clean-all"]
description = "Remove all build artifacts and the cache."
depends = ["clean"]
run = 'rm -rf "{{ config_root }}/cache"'

[tasks."update-rugix-recipes"]
description = "Create recipes for stable Rugix releases newer than 1.2.0."
run = 'python3 "{{ config_root }}/scripts/update_rugix_recipes.py" "$@"'

[tasks.kas]
shell = "nix develop \"{{config_root}}\" --command bash -euo pipefail -c"
description = "Run an arbitrary kas-container command."
run = "bash scripts/kas.sh \"$@\""

[tasks.build]
shell = "nix develop \"{{config_root}}\" --command bash -euo pipefail -c"
description = "Build a Yocto image with kas-container."
run = "bash scripts/kas.sh build \"$@\""

[tasks."run-qemu-x86_64"]
shell = "nix develop \"{{config_root}}\" --command bash -euo pipefail -c"
description = "Run the QEMU x86-64 image with GRUB EFI boot."
run = "exec uv run --locked rugix-testkit run --arch x86_64 --ssh-port 2222 \\\n    --drive {{ vars.deploy_dir }}/qemux86-64/core-image-minimal-qemux86-64.rootfs.wic,overlay=true,size=16G \\\n    --pflash {{ vars.deploy_dir }}/qemux86-64/ovmf.code.qcow2,format=qcow2,readonly=true \\\n    --pflash {{ vars.deploy_dir }}/qemux86-64/ovmf.vars.qcow2,format=qcow2 \\\n    \"$@\"\n"

[tasks."run-qemu-arm64"]
shell = "nix develop \"{{config_root}}\" --command bash -euo pipefail -c"
description = "Run the QEMU ARM64 image with U-Boot."
run = "exec uv run --locked rugix-testkit run --arch aarch64 --cpu cortex-a57 --ssh-port 2222 \\\n    --drive {{ vars.deploy_dir }}/qemuarm64/core-image-minimal-qemuarm64.rootfs.wic,interface=virtio,overlay=true,size=16G \\\n    --pflash {{ vars.deploy_dir }}/qemuarm64/u-boot.bin,size=64M,readonly=true \\\n    --pflash ,size=64M \\\n    \"$@\"\n"

[tasks."ssh-qemu"]
description = "SSH into a running QEMU VM."
run = "ssh {{ vars.ssh_opts }} -p 2222 root@localhost"

[tasks."scp-qemu"]
description = "Copy a file into a running QEMU VM."
usage = '''
arg "<file>" help="File to copy into the VM"
arg "[dest]" help="Destination path in the VM" default="/root"
'''
run = 'scp {{ vars.ssh_opts }} -P 2222 "$usage_file" "root@localhost:$usage_dest"'

[tasks.test]
shell = "nix develop \"{{config_root}}\" --command bash -euo pipefail -c"
description = "Run all integration tests."
run = "exec uv run --locked pytest \"$@\""

[tasks."test-x86_64"]
shell = "nix develop \"{{config_root}}\" --command bash -euo pipefail -c"
description = "Run integration tests for x86-64 only."
run = 'uv run --locked pytest -k "qemux86-64" "$@"'

[tasks."test-arm64"]
shell = "nix develop \"{{config_root}}\" --command bash -euo pipefail -c"
description = "Run integration tests for ARM64 only."
run = 'uv run --locked pytest -k "qemuarm64" "$@"'

[tasks."build-qemu-all"]
description = "Build all QEMU example images."
run = ["mise run build examples/qemu-x86_64-grub.yaml", "mise run build examples/qemu-arm64-uboot.yaml"]

[tasks."gen-signing-keys"]
shell = "nix develop \"{{config_root}}\" --command bash -euo pipefail -c"
description = "Generate an RSA key pair for U-Boot FIT image signing."
usage = '''
arg "[dir]" default="build/keys"
arg "[name]" default="dev"
'''
run = '''
mkdir -p "$usage_dir"
openssl genrsa -out "$usage_dir/$usage_name.key" 2048
openssl req -batch -new -x509 -key "$usage_dir/$usage_name.key" -out "$usage_dir/$usage_name.crt" -subj "/CN=Rugix FIT Signing Dev Key"
'''
